name: Test

run-name: Test (${{ github.event_name }}, ${{ github.ref_name }})

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun ${{ matrix.bun-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bun-version:
          - latest
          - "1.3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      # Needed by the tests that run case scripts with `--runtime node`
      # (TypeScript scripts need Node 22.18+).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types and formatting
        run: bun run check

      - name: Run tests
        run: bun test

      - name: Check the package to publish
        run: |
          bun run build
          npm pack dist/ --dry-run
